name: Deploy Novel Site to Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'content/**'
      - 'generate.js'
      - 'script.js'
      - 'style.css'
      - 'index.html'

# صلاحيات النشر والوصول لصفحات غيت هاب
permissions:
  contents: read
  pages: write
  id-token: write

# تجنب التكرار والتعارض أثناء النشر
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Manifest
        run: node generate.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
